name: Check and deploy static site
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image build dependency
        run: python -m pip install -r requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check assets/site.js
      - name: Build with deployment URL
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://colddcc.github.io/zhangjiajie' }}
        run: python scripts/build.py
      - name: Check all pages
        run: python scripts/check.py
      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.62.1 jsdom@30.1.3
          npx playwright install --with-deps chromium
      - name: Test planner combinations
        run: node scripts/planner-check.cjs
      - name: Check browser layouts and no-JS fallback
        run: node scripts/browser-check.cjs
      - name: Check responsive image selection
        run: node scripts/image-budget.cjs > image-budget.json
      - uses: actions/upload-artifact@v4
        with:
          name: responsive-image-measurements
          path: image-budget.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
